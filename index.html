<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Control de Labores | TaskFlow Pro</title>
    <meta name="description" content="Control de labores, asistencia, tareas, pagos y reportes corporativos." />
    <!-- Evita filtrar rutas internas de la app (con datos en la URL) a sitios externos como el mapa. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- PWA: el manifest lo genera vite-plugin-pwa (/manifest.webmanifest) en el build -->
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Labores" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
